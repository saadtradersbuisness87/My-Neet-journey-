<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* =========================================================
   SAAD KHAN — NEET 2027 MASTER PLANNER
   Reliability-first, mobile-first single-file application
========================================================= */

:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --line:#e5e9f2;
  --primary:#4f46e5;
  --physics:#f59e0b;
  --chem:#10b981;
  --botany:#22a06b;
  --zoology:#ef5b7d;
  --danger:#e5484d;
  --success:#16a34a;
  --shadow:0 8px 24px rgba(30,41,59,.08);
  --radius:18px;
  --nav-height:72px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.45;
  padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}

.app-header{
  position:sticky;top:0;z-index:50;
  background:rgba(16,24,39,.97);
  color:white;
  padding:14px 16px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
.profile-row{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
}
.app-name{
  font-size:19px;font-weight:900;letter-spacing:.3px;
}
.exam-label{
  display:inline-block;
  background:#ffffff18;
  border:1px solid #ffffff28;
  padding:3px 9px;border-radius:99px;
  font-size:12px;font-weight:800;margin-top:3px;
}
.header-date{
  text-align:right;font-size:12px;color:#d7dcef;
}
.header-progress{
  margin-top:12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
}
.mini-stat{
  background:#ffffff10;border:1px solid #ffffff15;
  padding:7px;border-radius:11px;text-align:center;
}
.mini-stat b{display:block;font-size:14px}
.mini-stat span{font-size:10px;color:#cdd5e5}

main{max-width:760px;margin:auto;padding:12px}

.screen{display:none}
.screen.active{display:block}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card h2,.card h3,.card h4{margin:0 0 8px}
.card h2{font-size:20px}
.card h3{font-size:16px}

.hero{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;border:none;
}
.hero p{margin:5px 0;color:#e9e7ff}

.section-title{
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin:18px 2px 9px;
}
.section-title h2{margin:0;font-size:19px}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.btn{
  border:0;border-radius:12px;padding:11px 14px;
  min-height:44px;font-weight:800;
  background:#eef0ff;color:#3932a9;
}
.btn.primary{background:var(--primary);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.dark{background:#182235;color:#fff}
.btn.outline{background:white;border:1px solid var(--line);color:var(--text)}
.btn.small{min-height:35px;padding:7px 10px;font-size:12px}
.btn.full{width:100%}

.subject-card{
  border-left:6px solid var(--primary);
}
.subject-card.physics{border-left-color:var(--physics)}
.subject-card.chemistry{border-left-color:var(--chem)}
.subject-card.botany{border-left-color:var(--botany)}
.subject-card.zoology{border-left-color:var(--zoology)}

.subject-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;
}
.subject-name{font-weight:900;font-size:16px}
.badge{
  padding:3px 8px;border-radius:99px;
  font-size:11px;font-weight:800;background:#eef2f7;
}
.badge.high{background:#fff3c4;color:#875f00}
.badge.done{background:#dff8e7;color:#16713a}
.badge.class11{background:#e8efff;color:#3154b8}
.badge.class12{background:#f2eaff;color:#7639a8}

.task{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-top:1px solid var(--line);
}
.task:first-of-type{border-top:0}
.task input[type=checkbox]{
  width:24px;height:24px;accent-color:var(--success);flex:none;
}
.task-main{flex:1}
.task-title{font-weight:800}
.task-meta{font-size:12px;color:var(--muted)}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}

.progress-wrap{margin-top:8px}
.progress{
  height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;
}
.progress > div{
  height:100%;background:var(--primary);border-radius:99px;
  transition:width .3s ease;
}
.physics .progress > div{background:var(--physics)}
.chemistry .progress > div{background:var(--chem)}
.botany .progress > div{background:var(--botany)}
.zoology .progress > div{background:var(--zoology)}

.stat-card{
  padding:12px;background:#fff;border:1px solid var(--line);
  border-radius:14px;text-align:center;
}
.stat-card b{font-size:20px;display:block}
.stat-card span{font-size:11px;color:var(--muted)}

.nav{
  position:fixed;z-index:60;bottom:0;left:0;right:0;
  height:calc(var(--nav-height) + env(safe-area-inset-bottom));
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
}
.nav button{
  border:0;background:transparent;color:#657085;
  font-size:10px;font-weight:800;min-width:54px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.nav button .icon{font-size:20px}
.nav button.active{color:var(--primary)}

.drawer{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(0,0,0,.45);
}
.drawer.open{display:block}
.drawer-panel{
  position:absolute;right:0;top:0;bottom:0;width:min(88vw,390px);
  background:#f7f8fc;overflow:auto;padding:16px;
}
.drawer-item{
  width:100%;text-align:left;border:0;background:#fff;
  padding:14px;border-radius:12px;margin-bottom:7px;
  font-weight:750;color:var(--text);box-shadow:0 2px 8px #00000008;
}

input,select,textarea{
  width:100%;padding:11px;border-radius:11px;
  border:1px solid #dce1eb;background:white;color:var(--text);
}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:12px;font-weight:800;margin:9px 0 5px}

.list-item{
  background:white;border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:8px;
}
.list-item.clickable{cursor:pointer}
.list-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.list-title{font-weight:850}
.list-sub{font-size:12px;color:var(--muted);margin-top:3px}

details{
  background:white;border:1px solid var(--line);
  border-radius:13px;padding:0;margin:8px 0;overflow:hidden;
}
details summary{
  padding:13px;font-weight:850;cursor:pointer;
}
.details-content{padding:0 13px 13px;color:#344054}
.topic-row{
  padding:10px 0;border-top:1px solid var(--line);
}
.topic-row:first-child{border-top:0}

.empty{
  padding:20px;text-align:center;color:var(--muted);
  background:#fff;border:1px dashed #cbd2df;border-radius:14px;
}
.notice{
  padding:10px;border-radius:11px;background:#fff8dd;
  color:#725900;font-size:13px;margin-top:8px;
}
.danger-notice{background:#ffe8e8;color:#9b2929}

.calendar{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
}
.cal-head{text-align:center;font-size:11px;font-weight:900;color:var(--muted)}
.cal-day{
  min-height:52px;border-radius:9px;border:1px solid var(--line);
  background:white;padding:5px;font-size:11px;text-align:left;
}
.cal-day.today{outline:2px solid var(--primary)}
.cal-day.complete{background:#e6f9eb}
.cal-day.partial{background:#fff8db}
.cal-day.missed{background:#ffe8e8}

.timetable-row{
  display:grid;grid-template-columns:72px 1fr auto;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.time{font-weight:800;font-size:12px}
.small-text{font-size:12px;color:var(--muted)}

.chapter-top{
  position:sticky;top:132px;z-index:20;background:var(--bg);
  padding:7px 0;
}
.chapter-tabs{
  display:flex;gap:6px;overflow:auto;padding-bottom:5px;
}
.chapter-tabs button{
  white-space:nowrap;border:1px solid var(--line);background:white;
  border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800;
}

.note-content{
  white-space:pre-wrap;line-height:1.65;
  font-size:14px;color:#293447;
}

.timer-display{
  font-size:46px;font-weight:900;text-align:center;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
  padding:15px 0;
}
.focus-screen{
  position:fixed;inset:0;background:#101827;color:#fff;z-index:200;
  display:none;padding:25px;
}
.focus-screen.open{display:flex;flex-direction:column;justify-content:center}
.focus-screen .timer-display{font-size:60px}

.search-row{display:flex;gap:7px;margin-bottom:10px}
.search-row input{flex:1}

.hidden{display:none!important}

@media(min-width:600px){
  .grid2{grid-template-columns:repeat(2,1fr)}
  .header-progress{grid-template-columns:repeat(7,1fr)}
}
</style>
</head>

function isoDate(d){
  if(typeof d==="string") return d.slice(0,10);

function genericContent(chapter,subject){
  const templates={
    Physics:{
      overview:`${chapter} develops a core physical model for understanding measurable phenomena. Focus on definitions, assumptions, relationships between quantities, diagrams, mathematical representation and numerical application. Connect the chapter with earlier mechanics or electricity concepts and learn when each formula is valid.`,
      topics:["Fundamental concepts","Definitions and terminology","Physical quantities","Key laws and principles","Mathematical relationships","Graph interpretation","Applications","Numerical problem solving","Common assumptions","NEET question patterns"],
      strategy:"Follow concept → derivation where useful → formula meaning → units → solved examples → numerical practice → PYQs → error analysis."
    },
    Chemistry:{
      overview:`${chapter} develops conceptual and factual understanding needed for NEET Chemistry. Identify whether the chapter is primarily physical, organic or inorganic and study accordingly: concepts and calculations for Physical Chemistry, mechanisms and patterns for Organic Chemistry, and NCERT trends and exceptions for Inorganic Chemistry.`,
      topics:["Core definitions","Fundamental concepts","Important trends","Key reactions or equations","Conditions","Exceptions","Applications","NCERT facts","Question patterns","PYQ focus"],
      strategy:"Identify the chapter type. Physical: concept → equations → units → calculations. Organic: concept → mechanism → patterns → conversions. Inorganic: NCERT → trends → exceptions → reactions → recall."
    },
    Botany:{
      overview:`${chapter} explains an important part of plant biology and should be studied through NCERT terminology, diagrams, processes and relationships. Build understanding first and then convert information into active recall questions.`,
      topics:["Definitions","Structural features","Processes","Classification or relationships","Important terminology","Diagrams","NCERT facts","Examples","Exceptions","PYQ focus"],
      strategy:"Read NCERT line by line → understand diagrams → learn terminology → active recall → NCERT-based MCQs → PYQs → repeated revision."
    },
    Zoology:{
      overview:`${chapter} explains biological structure, function or processes in animals and humans. NEET questions often test exact terminology, sequence, regulation and NCERT details.`,
      topics:["Definitions","Structures","Processes","Regulation","Important terminology","Diagrams","Comparisons","NCERT facts","Common confusions","PYQ focus"],
      strategy:"Study from NCERT → map processes visually → practise diagrams → active recall → NCERT questions → PYQs → revise weak facts."
    }
  };
  return templates[subject];
}

function getContent(chapter,subject){
  return CHAPTER_CONTENT[chapter] || genericContent(chapter,subject);
}

function priorityFor(chapter){
 const high=[
  "Electrostatics","Current Electricity","Ray Optics","Modern Physics",
  "Solutions","Electrochemistry","Chemical Kinetics","Chemical Bonding",
  "Human Reproduction","Molecular Basis of Inheritance",
  "Principle of Inheritance and Variation","Sexual Reproduction in Flowering Plant",
  "Biotechnology: Principles & Processes","Human Health & Diseases",
  "Thermodynamics","Equilibrium","Biomolecules","Animal Kingdom"
 ];
 if(high.some(x=>chapter.includes(x)||x.includes(chapter))) return "High";
 return "Normal";
}

function loadData(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw) return createDefaultData();
  const parsed=JSON.parse(raw);
  if(!parsed || typeof parsed!=="object") return createDefaultData();

  const base=createDefaultData();
  const merged={...base,...parsed};
  merged.settings={...base.settings,...(parsed.settings||{})};
  merged.settings.dailyLectureTargets={
   ...base.settings.dailyLectureTargets,
   ...(parsed.settings?.dailyLectureTargets||{})
  };
  merged.settings.questionTargets={
   ...base.settings.questionTargets,
   ...(parsed.settings?.questionTargets||{})
  };
  return merged;
 }catch(err){
  console.error("Storage recovery:",err);
  return createDefaultData();
 }
}

========================================================= */

function findChapter(subject,name){
 const item=RAW_SYLLABUS[subject].chapters.find(x=>x[1]===name);
 return item ? {class:item[0],name:item[1],lectures:item[2]} : null;
}

function orderedChapters(subject){
 return SEQUENCES[subject].map(name=>findChapter(subject,name)).filter(Boolean);
}

function chapterKey(subject,name){return subject+"::"+name}
function lectureKey(subject,chapter,no){return subject+"::"+chapter+"::"+no}

function initializeRecords(){
 ["Physics","Chemistry","Botany","Zoology"].forEach(subject=>{
  RAW_SYLLABUS[subject].chapters.forEach(([cls,name,total])=>{
   const ck=chapterKey(subject,name);

   if(!DB.chapterProgress[ck]){
    DB.chapterProgress[ck]={
     subject,class:cls,chapter:name,totalLectures:total,
     completedLectures:[],
     completed:false,
     checklist:{},
     ncert:{read:false,important:false,questions:false,revised:false,pyqs:false},
     test:{completed:false,score:null},
     priority:priorityFor(name)
    };
   }

   for(let i=1;i<=total;i++){
    const lk=lectureKey(subject,name,i);
    if(!DB.lectures[lk]){
     DB.lectures[lk]={
      id:uid(),subject,chapter:name,class:cls,number:i,
      completed:false,completedDate:null,backlog:false
     };
    }
   }
  });
 });
 saveData();
}

/* =========================================================
   LECTURE POINTERS
========================================================= */

function getNextLectures(subject,count){
 const result=[];
 const ordered=orderedChapters(subject);

 for(const chapter of ordered){
  const progress=DB.chapterProgress[chapterKey(subject,chapter.name)];
  if(progress?.completed) continue;

  for(let n=1;n<=chapter.lectures;n++){
   const lecture=DB.lectures[lectureKey(subject,chapter.name,n)];
   if(lecture && !lecture.completed){
    result.push({
     subject,
     chapter:chapter.name,
     class:chapter.class,
     number:n,
     total:chapter.lectures,
     lectureKey:lectureKey(subject,chapter.name,n),
     backlog:lecture.backlog||false
    });
    if(result.length>=count) return result;
   }
  }
 }
 return result;
}

function defaultQuestionTasks(plan){
 const tasks=[];
 const active={};
 plan.lectures.forEach(l=>{
  if(!active[l.subject]) active[l.subject]=new Set();
  active[l.subject].add(l.chapter);
 });

 Object.entries(active).forEach(([subject,set])=>{
  [...set].slice(0,2).forEach(chapter=>{
   if(subject==="Physics"){
    tasks.push({id:uid(),subject,chapter,type:"PYQ",target:10,completed:0});
    tasks.push({id:uid(),subject,chapter,type:"Numerical / Concept",target:10,completed:0});
   }else if(subject==="Chemistry"){
    tasks.push({id:uid(),subject,chapter,type:"PYQ / Practice",target:10,completed:0});
   }else{
    tasks.push({id:uid(),subject,chapter,type:"NCERT Based",target:15,completed:0});
    tasks.push({id:uid(),subject,chapter,type:"PYQ",target:10,completed:0});
   }
  });
 });
 return tasks;
}

function createPlan(date){
 const targets=DB.settings.dailyLectureTargets;
 let lectures=[];

 ["Physics","Chemistry","Botany","Zoology"].forEach(subject=>{
  lectures.push(...getNextLectures(subject,safeNumber(targets[subject],0)));
 });

 const plan={
  id:uid(),
  date,
  lectures,
  questions:[],
  ncert:[],
  revisions:[],
  studyHoursTarget:safeNumber(DB.settings.dailyStudyHours,10),
  createdAt:Date.now()
 };

 plan.questions=defaultQuestionTasks(plan);

 /* Biology NCERT explicitly attached to today's Biology lectures */
 lectures.filter(x=>x.subject==="Botany"||x.subject==="Zoology").forEach(l=>{
  plan.ncert.push({
   id:uid(),
   subject:l.subject,
   chapter:l.chapter,
   type:"Read relevant NCERT section + diagrams",
   completed:false
  });
 });

 return plan;
}

function getPlan(date){
 if(!DB.dailyPlans[date]){
  DB.dailyPlans[date]=createPlan(date);
  saveData();
 }
 return DB.dailyPlans[date];
}

function planStats(plan){
 const total=plan.lectures.length+
   plan.ncert.length+
   plan.revisions.length;

 const doneLectures=plan.lectures.filter(l=>DB.lectures[l.lectureKey]?.completed).length;
 const doneNcert=plan.ncert.filter(x=>x.completed).length;
 const doneRev=plan.revisions.filter(x=>x.completed).length;

 const completed=doneLectures+doneNcert+doneRev;
 return {
  total,
  completed,
  percent:total?Math.round(completed/total*100):0,
  doneLectures
 };
}

/* =========================================================
   REVISION ENGINE
========================================================= */

function createRevisionsForLecture(lecture){
 REVISION_INTERVALS.forEach(days=>{
  const dueDate=dateAdd(lecture.completedDate,days);
  const key=lectureKey(lecture.subject,lecture.chapter,lecture.number)+"::"+days;

  if(!DB.revisions[key]){
   DB.revisions[key]={
    id:uid(),
    key,
    subject:lecture.subject,
    chapter:lecture.chapter,
    class:lecture.class,
    lectureNumber:lecture.number,
    interval:days,
    dueDate,
    completed:false,
    createdAt:Date.now()
   };
  }

  const duePlan=getPlan(dueDate);
  const exists=duePlan.revisions.some(r=>r.revisionKey===key);
  if(!exists){
   duePlan.revisions.push({
    id:uid(),
    revisionKey:key,
    subject:lecture.subject,
    chapter:lecture.chapter,
    lectureNumber:lecture.number,
    interval:days,
    completed:false
   });
  }
 });
}

function dueRevisions(date){
 return Object.values(DB.revisions).filter(r=>r.dueDate<=date&&!r.completed);
}

/* =========================================================
   CHAPTER PROGRESS
========================================================= */

function updateChapterProgress(subject,chapter){
 const ch=findChapter(subject,chapter);
 if(!ch) return;

 const p=DB.chapterProgress[chapterKey(subject,chapter)];
 if(!p) return;

 const completed=[];
 for(let i=1;i<=ch.lectures;i++){
  const l=DB.lectures[lectureKey(subject,chapter,i)];
  if(l?.completed) completed.push(i);
 }
 p.completedLectures=completed;
}

function chapterMastery(subject,chapter){
 const p=DB.chapterProgress[chapterKey(subject,chapter)];
 if(!p) return 0;
 const total=Math.max(1,p.totalLectures);
 const lecturePct=p.completedLectures.length/total*25;
 const topics=getContent(chapter,subject).topics;
 const topicDone=topics.filter((_,i)=>DB.topicStatus[chapterKey(subject,chapter)+"::"+i]==="Strong").length;
 const topicPct=(topicDone/Math.max(1,topics.length))*15;
 const n=Object.values(p.ncert).filter(Boolean).length/5*15;
 const rev=Object.values(DB.revisions).filter(r=>r.subject===subject&&r.chapter===chapter);
 const revPct=rev.length?rev.filter(r=>r.completed).length/rev.length*10:0;
 const q=getChapterQuestionStats(subject,chapter);
 const qPct=Math.min(15,(q.attempted/50)*15);
 const test=p.test.completed?10:0;
 const checklist=Object.values(p.checklist).filter(Boolean).length/13*10;
 return Math.round(clamp(lecturePct+topicPct+n+revPct+qPct+test+checklist,0,100));
}

function markChapterComplete(subject,chapter){
 const ch=findChapter(subject,chapter);
 if(!ch) return;
 const p=DB.chapterProgress[chapterKey(subject,chapter)];

 for(let i=1;i<=ch.lectures;i++){
  const l=DB.lectures[lectureKey(subject,chapter,i)];
  if(!l.completed){
   l.completed=true;
   l.completedDate=DB.plannerDate;
   createRevisionsForLecture(l);
  }
 }
 p.completed=true;
 p.completedLectures=Array.from({length:ch.lectures},(_,i)=>i+1);
 DB.completedChapters[chapterKey(subject,chapter)]={subject,chapter,date:DB.plannerDate};
 saveData();
 render();
}

function undoChapterComplete(subject,chapter){
 const p=DB.chapterProgress[chapterKey(subject,chapter)];
 if(!p) return;
 p.completed=false;
 delete DB.completedChapters[chapterKey(subject,chapter)];
 saveData();
 render();
}

/* =========================================================
   ACTIONS
========================================================= */

function toggleLecture(key){
 const l=DB.lectures[key];
 if(!l) return;

 if(!l.completed){
  l.completed=true;
  l.completedDate=DB.plannerDate;
  l.backlog=false;
  createRevisionsForLecture(l);
 }else{
  l.completed=false;
  l.completedDate=null;
 }
 updateChapterProgress(l.subject,l.chapter);
 saveData();
 render();
}

function toggleNcert(date,id){
 const p=getPlan(date);
 const task=p.ncert.find(x=>x.id===id);
 if(task) task.completed=!task.completed;
 saveData();render();
}

function toggleRevision(date,id){
 const p=getPlan(date);
 const task=p.revisions.find(x=>x.id===id);
 if(!task)return;
 task.completed=!task.completed;
 const r=DB.revisions[task.revisionKey];
 if(r)r.completed=task.completed;
 saveData();render();
}

function updateQuestionTask(date,id,value){
 const p=getPlan(date);
 const q=p.questions.find(x=>x.id===id);
 if(!q)return;
 q.completed=clamp(safeNumber(value),0,q.target);
 saveData();render();
}

function completeTodayAndAdvance(){
 const plan=getPlan(DB.plannerDate);
 const incomplete=plan.lectures.filter(l=>!DB.lectures[l.lectureKey]?.completed);

 if(incomplete.length){
  if(!confirm(`${incomplete.length} lecture(s) are unfinished. Move them to backlog and advance?`)) return;

  incomplete.forEach(l=>{
   const rec=DB.lectures[l.lectureKey];
   if(rec) rec.backlog=true;
  });
 }

 updateStreak(planStats(plan).percent>=70);
 const next=dateAdd(DB.plannerDate,1);
 DB.plannerDate=next;
 getPlan(next);
 saveData();
 render();
}

function updateStreak(success){
 const today=DB.plannerDate;
 if(success){
  if(DB.streak.lastDate===dateAdd(today,-1)){
   DB.streak.current++;
  }else if(DB.streak.lastDate!==today){
   DB.streak.current=1;
  }
  DB.streak.lastDate=today;
  DB.streak.best=Math.max(DB.streak.best,DB.streak.current);
 }
}

function allLectures(){
 return Object.values(DB.lectures);
}
function overallLectureStats(){
 const all=allLectures();
 const completed=all.filter(x=>x.completed).length;
 return {total:all.length,completed,remaining:all.length-completed,
  percent:all.length?Math.round(completed/all.length*100):0};
}

function subjectStats(subject){
 const all=allLectures().filter(x=>x.subject===subject);
 const done=all.filter(x=>x.completed).length;
 return {total:all.length,done,percent:all.length?Math.round(done/all.length*100):0};
}

function getChapterQuestionStats(subject,chapter){
 const qs=DB.questions.filter(q=>q.subject===subject&&q.chapter===chapter);
 const attempted=qs.length;
 const correct=qs.filter(q=>q.result==="Correct").length;
 const wrong=qs.filter(q=>q.result==="Wrong").length;
 const skipped=qs.filter(q=>q.result==="Skipped").length;
 return {
  attempted,correct,wrong,skipped,
  accuracy:attempted?Math.round(correct/attempted*100):0
 };
}

function totalQuestionStats(){
 const attempted=DB.questions.length;
 const correct=DB.questions.filter(q=>q.result==="Correct").length;
 const wrong=DB.questions.filter(q=>q.result==="Wrong").length;
 const skipped=DB.questions.filter(q=>q.result==="Skipped").length;
 return {attempted,correct,wrong,skipped,
 accuracy:attempted?Math.round(correct/attempted*100):0};
}

function studySeconds(){
 let sec=DB.studySessions.reduce((s,x)=>s+safeNumber(x.duration),0);
 if(DB.timer.running&&DB.timer.startedAt){
  sec+=Math.max(0,(Date.now()-DB.timer.startedAt)/1000);
 }
 sec+=safeNumber(DB.timer.accumulated);
 return sec;
}
function manualHours(){
 return Object.values(DB.manualHours).reduce((s,x)=>s+safeNumber(x),0);
}

function whatNow(){
 const date=DB.plannerDate;
 const plan=getPlan(date);

 const overdue=dueRevisions(date).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
 if(overdue.length){
  const r=overdue[0];
  alert(`🔄 DO THIS NOW:\n\nRevision due: ${r.subject} — ${r.chapter}, Lecture ${r.lectureNumber}\n\nReason: spaced revision is overdue.`);
  return;
 }

 const unfinished=plan.lectures.find(l=>!DB.lectures[l.lectureKey]?.completed);
 if(unfinished){
  alert(`🎯 DO THIS NOW:\n\nComplete ${unfinished.subject} — ${unfinished.chapter} Lecture ${unfinished.number} of ${unfinished.total}.`);
  return;
 }

 const ncert=plan.ncert.find(x=>!x.completed);
 if(ncert){
  alert(`📖 DO THIS NOW:\n\nRead NCERT: ${ncert.subject} — ${ncert.chapter}\nFocus on terminology and diagrams.`);
  return;
 }

 const weak=DB.weakTopics.find(x=>x.status==="Weak");
 if(weak){
  alert(`⚠️ DO THIS NOW:\n\nRepair weak topic: ${weak.subject} — ${weak.chapter}\nTopic: ${weak.topic}`);
  return;
 }

 alert("🏆 Great work. Your main daily targets are complete. Review errors or perform active recall.");
}

function renderCalendar(){
 const months=[];
 for(let d=new Date("2026-08-01");d<=new Date("2027-05-01");d.setMonth(d.getMonth()+1)){
  months.push(new Date(d));
 }

 return `<section class="screen" id="screen-calendar">
 <div class="card"><h2>📆 CALENDAR</h2><p class="small-text">Tap any day to open its target.</p></div>
 ${months.map(month=>calendarMonth(month)).join("")}
 </section>`;
}

function calendarMonth(month){
 const year=month.getFullYear(), m=month.getMonth();
 const title=new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric"}).format(month);
 const first=new Date(year,m,1).getDay();
 const days=new Date(year,m+1,0).getDate();

 let cells="";
 for(let i=0;i<first;i++)cells+=`<div></div>`;

 for(let day=1;day<=days;day++){
  const date=isoDate(new Date(year,m,day));
  const plan=getPlan(date);
  const s=planStats(plan);
  const cls=date===DB.plannerDate?"today":s.percent===100?"complete":s.percent>0?"partial":"";
  cells+=`<button class="cal-day ${cls}" onclick="openDate('${date}')">
    <b>${day}</b><br>
    <span>${s.percent===100?"✓":s.percent>0?"◐":"○"} ${s.percent}%</span>
   </button>`;
 }

 return `<div class="card">
   <h3>${title}</h3>
   <div class="calendar">
    ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cal-head">${x}</div>`).join("")}
    ${cells}
   </div>
 </div>`;
}

let timerInterval=null;

function currentTimerSeconds(){
 let sec=safeNumber(DB.timer.accumulated);
 if(DB.timer.running&&DB.timer.startedAt){
  sec+=(Date.now()-DB.timer.startedAt)/1000;
 }
 return Math.max(0,Math.floor(sec));
}
function formatSeconds(sec){
 sec=Math.max(0,Math.floor(sec));
 const h=String(Math.floor(sec/3600)).padStart(2,"0");
 const m=String(Math.floor(sec%3600/60)).padStart(2,"0");
 const s=String(sec%60).padStart(2,"0");
 return `${h}:${m}:${s}`;
}
function updateTimerDisplays(){
 const value=formatSeconds(currentTimerSeconds());
 const a=$("timerDisplay"),b=$("focusTimer");
 if(a)a.textContent=value;
 if(b)b.textContent=value;
}

function timerAction(action){
 if(action==="start"){
  if(!DB.timer.running){
   DB.timer.running=true;
   DB.timer.startedAt=Date.now();
  }
 }
 if(action==="pause"){
  if(DB.timer.running&&DB.timer.startedAt){
   DB.timer.accumulated+=Math.max(0,(Date.now()-DB.timer.startedAt)/1000);
   DB.timer.running=false;
   DB.timer.startedAt=null;
  }
 }
 if(action==="stop"){
  timerAction("pause");
  if(DB.timer.accumulated>0){
   DB.studySessions.push({
    id:uid(),
    start:null,end:Date.now(),
    duration:Math.round(DB.timer.accumulated),
    category:DB.timer.category||"Study",
    subject:DB.timer.subject||"",
    chapter:DB.timer.chapter||"",
    topic:DB.timer.topic||""
   });
  }
  DB.timer.accumulated=0;
 }
 if(action==="reset"){
  DB.timer.running=false;
  DB.timer.startedAt=null;
  DB.timer.accumulated=0;
 }
 saveData();
 updateTimerDisplays();
}

 <p class="small-text">Strong topics still receive spaced revision at lower urgency.</p></div>
 ${DB.strongTopics.length?DB.strongTopics.map(x=>`<div class="list-item"><b>${esc(x.subject)} — ${esc(x.chapter)}</b><div>${esc(x.topic)}</div></div>`).join(""):
 `<div class="empty">Mark topics Strong from chapter topic tracking.</div>`}
 </section>`;
}

/* =========================================================
   WEEKLY / MONTHLY
========================================================= */

function weekRange(date){
 const d=new Date(date+"T12:00:00");
 const day=d.getDay()||7;
 d.setDate(d.getDate()-day+1);
 const start=isoDate(d),end=dateAdd(start,6);
 return {start,end};
}
function renderWeekly(){
 const w=weekRange(DB.plannerDate);
 const plans=[];
 for(let d=w.start;d<=w.end;d=dateAdd(d,1))plans.push(getPlan(d));
 const lectures=plans.reduce((s,p)=>s+planStats(p).doneLectures,0);
 const questions=plans.reduce((s,p)=>s+p.questions.reduce((a,q)=>a+q.completed,0),0);

 return `<section class="screen" id="screen-weekly">
 <div class="card">
 <h2>📈 WEEKLY TARGETS</h2>
 <p>${formatDate(w.start)} → ${formatDate(w.end)}</p>
 </div>
 <div class="card">
 ${targetRow("Lectures",DB.weeklyTargets.lectures,lectures)}
 ${targetRow("Questions",DB.weeklyTargets.questions,questions)}
 ${targetRow("Study Hours",DB.weeklyTargets.hours,0)}
 ${targetRow("Revisions",DB.weeklyTargets.revisions,plans.reduce((s,p)=>s+p.revisions.filter(x=>x.completed).length,0))}
 </div>
 </section>`;
}
function targetRow(name,target,done){
 const pct=target?Math.round(done/target*100):0;
 return `<div style="margin:13px 0">
  <div class="list-top"><b>${name}</b><span>${done}/${target} (${pct}%)</span></div>
  <div class="progress"><div style="width:${Math.min(100,pct)}%"></div></div>
 </div>`;
}

function renderMonthly(){
 const months=["2026-08","2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05"];
 return `<section class="screen" id="screen-monthly">
 <div class="card"><h2>🗓 MONTHLY TARGETS</h2></div>
 ${months.map(month=>{
  const plans=Object.entries(DB.dailyPlans).filter(([d])=>d.startsWith(month)).map(x=>x[1]);
  const lectureDone=plans.reduce((s,p)=>s+planStats(p).doneLectures,0);
  return `<div class="list-item">
   <div class="list-top"><b>${new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric"}).format(new Date(month+"-01T12:00:00"))}</b>
   <span class="badge">${lectureDone} lectures</span></div>
   <div class="small-text">Track syllabus, lectures, questions, NCERT, revisions, study hours and tests.</div>
  </div>`;
 }).join("")}
 </section>`;
}

/* =========================================================
   TESTS / COMPLETED
========================================================= */

function renderTests(){
 return `<section class="screen" id="screen-tests">
 <div class="card"><h2>🧪 TEST SYSTEM</h2>
 <div class="grid2">
  <button class="btn outline" onclick="addTest('Chapter Test')">Chapter Test</button>
  <button class="btn outline" onclick="addTest('Subject Test')">Subject Test</button>
  <button class="btn outline" onclick="addTest('Mixed Test')">Mixed Test</button>
  <button class="btn primary" onclick="addTest('NEET Mock')">NEET Mock</button>
 </div></div>
 ${DB.tests.map(t=>`<div class="list-item"><b>${t.type}</b><div class="small-text">${formatDate(t.date)}</div></div>`).join("")}
 </section>`;
}
function addTest(type){
 DB.tests.push({id:uid(),type,date:DB.plannerDate,correct:0,wrong:0,skipped:0});
 saveData();render();
}

function renderCompleted(){
 const list=Object.values(DB.completedChapters);
 return `<section class="screen" id="screen-completed">
 <div class="card"><h2>🏆 COMPLETED CHAPTERS</h2></div>
 ${list.length?list.map(x=>`<div class="list-item clickable" onclick="openChapter('${x.subject}','${encodeURIComponent(x.chapter)}')">
 <b>${x.subject} — ${esc(x.chapter)}</b>
 <div class="small-text">Completed ${formatDate(x.date)}</div>
 </div>`).join(""):`<div class="empty">No chapter marked complete yet.</div>`}

/* =========================================================
   FOCUS
========================================================= */

function renderFocus(){
 return `<section class="screen" id="screen-focus">
 <div class="card">
  <h2>🚫 FOCUS MODE</h2>
  <p>Use a distraction-free full-screen study environment.</p>
  <input id="focusInput" placeholder="Current task, e.g. Electrostatics L3">
  <button class="btn dark full" style="margin-top:10px" onclick="enterFocus()">Enter Focus Mode</button>
  <div class="notice">Website Focus Mode active only. It cannot truthfully block Instagram, WhatsApp, YouTube or other Android apps.</div>
 </div>
 </section>`;
}
function enterFocus(){
 $("focusTask").textContent=$("focusInput")?.value||"Focus on your selected task.";
 $("focusOverlay").classList.add("open");
 updateTimerDisplays();
}
function exitFocus(){$("focusOverlay").classList.remove("open")}

/* =========================================================
   JAN–MAY
========================================================= */

function renderJanMay(){
 const plan={
  January:["Board Revision","NCERT Revision","Chapter Revision","Board Questions","Important Formulas","Derivations","Writing Practice"],
  February:["Board Preparation","Board PYQs","Sample Papers","Timed Papers","Writing Practice"],
  March:["Board Exams","NEET Transition"],
  April:["NEET Intensive Revision","NCERT","PYQs","Full Syllabus Tests","Weak Topics","Error Book","Formula Revision","Reaction Revision"],

 };
 return `<section class="screen" id="screen-janmay">

 ${Object.entries(plan).map(([m,t])=>`<div class="card"><h3>${m}</h3>

/* =========================================================
   BACKUP / SETTINGS
========================================================= */

function renderBackup(){
 return `<section class="screen" id="screen-backup">
 <div class="card"><h2>💾 BACKUP / RESTORE</h2>
 <button class="btn primary full" onclick="exportBackup()">Export Full Backup</button>
 <label>Import JSON Backup</label>
 <input type="file" accept=".json,application/json" onchange="importBackup(event)">
 <button class="btn danger full" style="margin-top:15px" onclick="resetAll()">RESET ALL DATA</button>
 </div>
 </section>`;
}

function exportBackup(){
 const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="saad_neet_2027_backup_"+isoDate(new Date())+".json";
 a.click();URL.revokeObjectURL(url);
}
function importBackup(e){
 const file=e.target.files?.[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result);
   if(!parsed||typeof parsed!=="object")throw new Error();
   if(!confirm("Restore backup? Current data will be replaced."))return;
   DB={...createDefaultData(),...parsed};
   initializeRecords();
   saveData();render();
   alert("Backup restored.");
  }catch{
   alert("Invalid backup file.");
  }
 };
 reader.readAsText(file);
}
function resetAll(){
 if(!confirm("This will permanently remove all planner data. Continue?"))return;
 if(!confirm("Final confirmation: RESET EVERYTHING?"))return;
 localStorage.removeItem(STORAGE_KEY);
 DB=createDefaultData();
 initializeRecords();
 render();
}

function renderSettings(){
 return `<section class="screen" id="screen-settings">
 <div class="card">
 <h2>⚙️ SETTINGS</h2>
 <h3>Daily Lecture Targets</h3>
 ${["Physics","Chemistry","Botany","Zoology"].map(s=>`
 <label>${s}</label>
 <input type="number" min="0" max="10" value="${DB.settings.dailyLectureTargets[s]}"
 onchange="updateLectureTarget('${s}',this.value)">`).join("")}
 <label>Daily Study Hour Target</label>
 <input type="number" min="1" max="16" value="${DB.settings.dailyStudyHours}"
 onchange="DB.settings.dailyStudyHours=clamp(safeNumber(this.value,10),1,16);saveData()">

 <h3 style="margin-top:20px">Planner Date</h3>
 <input type="date" value="${DB.plannerDate}" min="${START_DATE}" onchange="DB.plannerDate=this.value;saveData();render()">

 <h3 style="margin-top:20px">Timetable</h3>
 <textarea id="timetableEditor">${DB.settings.timetable.map(x=>x.join(" | ")).join("\n")}</textarea>
 <button class="btn primary full" style="margin-top:8px" onclick="saveTimetable()">Save Timetable</button>
 </div>
 </section>`;
}
function updateLectureTarget(subject,value){
 DB.settings.dailyLectureTargets[subject]=clamp(safeNumber(value,0),0,10);
 saveData();
}
function saveTimetable(){
 const rows=$("timetableEditor").value.split("\n")
  .map(x=>x.split("|").map(y=>y.trim()))
  .filter(x=>x.length>=2);
 if(rows.length)DB.settings.timetable=rows;
 saveData();render();
}

/* =========================================================
   SCREEN ROUTER
========================================================= */

const renderers={
 today:renderToday,
 days:renderDays,
 calendar:renderCalendar,
 syllabus:renderSyllabus,
 progress:renderProgress,
 weekly:renderWeekly,
 monthly:renderMonthly,
 timer:renderTimer,
 revision:renderRevision,
 questions:renderQuestions,
 ncert:renderNcert,
 notes:renderNotes,
 formula:renderFormula,
 math:renderMath,
 units:renderUnits,
 errors:renderErrors,
 weak:renderWeak,
 strong:renderStrong,
 tests:renderTests,
 completed:renderCompleted,
 focus:renderFocus,
 janmay:renderJanMay,
 backup:renderBackup,
 settings:renderSettings
};

let currentScreen="today";

function showScreen(name){
 if(!renderers[name])name="today";
 currentScreen=name;
 closeDrawer();

 document.getElementById("app").innerHTML=renderers[name]();
 document.querySelectorAll(".nav-btn").forEach(b=>{
  b.classList.toggle("active",b.dataset.screen===name);
 });

 if(name==="units")setTimeout(populateUnits,0);
 if(name==="math")setTimeout(showRearrangement,0);
 if(name==="timer")updateTimerDisplays();
 window.scrollTo({top:0,behavior:"smooth"});
 renderHeader();
}

function render(){
 if(currentScreen==="chapter"){
  showScreen("syllabus");
 }else{
  showScreen(currentScreen);
 }
 renderHeader();
}

function openDrawer(){$("drawer").classList.add("open")}
function closeDrawer(){$("drawer").classList.remove("open")}

/* =========================================================
   INITIALIZATION
========================================================= */

function init(){
 try{
  initializeRecords();

  /* Guarantee first-load planner date */
  if(!DB.plannerDate || typeof DB.plannerDate!=="string"){
   DB.plannerDate=START_DATE;
  }

  getPlan(DB.plannerDate);

  document.querySelectorAll(".nav-btn").forEach(btn=>{
   btn.addEventListener("click",()=>showScreen(btn.dataset.screen));
  });

  $("moreBtn").addEventListener("click",openDrawer);

  document.querySelectorAll(".drawer-item").forEach(btn=>{
   btn.addEventListener("click",()=>showScreen(btn.dataset.screen));
  });

  $("drawer").addEventListener("click",e=>{
   if(e.target===$("drawer"))closeDrawer();
  });

  setInterval(updateTimerDisplays,1000);

  /* Critical: always render something */
  showScreen("today");

 }catch(err){
  console.error("Initialization error:",err);

  document.getElementById("app").innerHTML=`
   <section class="screen active">
    <div class="card">
     <h2>SAAD KHAN — NEET 2027</h2>
     <p>Planner recovery mode.</p>
     <button class="btn primary full" onclick="recoverApp()">Recover Application Data</button>
    </div>
   </section>`;
 }
}

function recoverApp(){
 try{
  DB=createDefaultData();
  initializeRecords();
  currentScreen="today";
  showScreen("today");
 }catch(e){
  alert("Recovery failed. Clear this website's local storage and reopen the file.");
 }
}

init();
</script>
