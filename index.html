<style>
:root{
 --bg:#f4f6fb;--card:#ffffff;--ink:#172033;--muted:#697386;
 --line:#e5e9f0;--dark:#111827;--purple:#6957e8;
 --physics:#f59e0b;--chem:#10b981;--bot:#22c55e;--zoo:#ef4444;
 --danger:#dc2626;--success:#16a34a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 font-size:16px;padding-bottom:82px
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none}
.app{max-width:760px;margin:auto}

/* HEADER */
header{
 position:sticky;top:0;z-index:100;
 background:linear-gradient(135deg,#101827,#202b3d);
 color:white;padding:17px 16px 14px;
 box-shadow:0 2px 15px #0003
}
.profile{display:flex;justify-content:space-between;gap:10px}
.name{font-size:25px;font-weight:900;letter-spacing:.4px}
.exam{
 display:inline-block;margin-top:5px;padding:5px 10px;
 border-radius:99px;background:#ffffff12;border:1px solid #ffffff22;
 font-size:13px;font-weight:800
}
.planner-date{text-align:right;font-weight:800;color:#d7deeb}
.planner-date small{font-weight:500;color:#b8c1d0}
.stats{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:7px;margin-top:15px
}
.stat{
 background:#ffffff0d;border:1px solid #ffffff16;
 padding:8px 4px;border-radius:14px;text-align:center
}
.stat b{display:block;font-size:16px}
.stat span{font-size:10px;color:#cbd5e1}

/* MAIN */
main{padding:10px 11px}
.screen{display:none}
.screen.active{display:block}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:18px;padding:14px;margin-bottom:10px;
 box-shadow:0 4px 18px rgba(15,23,42,.04)
}
.hero{
 background:linear-gradient(135deg,#6657e8,#8b5cf6);
 color:white;border:none
}
.title{font-size:21px;font-weight:900;margin:2px 0 8px}
.subtitle{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:9px}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.btn{
 padding:10px 13px;border-radius:12px;
 background:#eef0ff;color:#4d3ac8;font-weight:800
}
.btn.primary{background:var(--purple);color:white}
.btn.success{background:#dcfce7;color:#166534}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.dark{background:#172033;color:white}
.btn.small{padding:7px 9px;font-size:12px}

.subject{
 border-left:6px solid var(--subject);
 padding:13px
}
.subject h3{margin:0;font-size:17px}
.lecture{
 display:flex;align-items:center;gap:10px;
 padding:10px 0;border-top:1px solid var(--line)
}
.lecture:first-of-type{border-top:0}
.lecture input{width:24px;height:24px;accent-color:var(--purple);flex:none}
.lecture b{font-size:14px}
.lecture small{color:var(--muted)}
.progress{
 height:9px;background:#edf0f5;border-radius:10px;overflow:hidden
}
.progress i{
 display:block;height:100%;background:var(--purple);border-radius:10px
}
.pill{
 display:inline-block;padding:4px 8px;border-radius:99px;
 background:#eef2ff;color:#4937c5;font-size:11px;font-weight:800
}
.muted{color:var(--muted)}
.kpi{
 padding:12px;border-radius:15px;background:#fff;
 border:1px solid var(--line)
}
.kpi b{font-size:21px}
.kpi span{display:block;color:var(--muted);font-size:12px}

input[type=text],input[type=number],select,textarea,input[type=date]{
 width:100%;padding:11px;border:1px solid var(--line);
 border-radius:11px;background:white;color:var(--ink)
}
textarea{min-height:110px;resize:vertical}
label.form{display:block;font-weight:800;font-size:13px;margin:8px 0}
label.form input,label.form textarea,label.form select{margin-top:5px;font-weight:400}

/* CHAPTERS */
.chapter{
 background:#fff;border:1px solid var(--line);
 border-radius:15px;padding:12px;margin-bottom:8px
}
.chapter-head{width:100%;background:none;text-align:left;padding:0;color:var(--ink)}
.chapter-name{font-size:16px;font-weight:900}
.chapter-meta{font-size:12px;color:var(--muted);margin-top:4px}
.high{color:#b45309;font-weight:900}
.class11{background:#eff6ff;color:#1d4ed8}
.class12{background:#f3e8ff;color:#7e22ce}
.tag{
 display:inline-block;padding:3px 7px;border-radius:7px;
 font-size:10px;font-weight:900;margin-right:4px
}

/* DETAILS */
details{
 background:white;border:1px solid var(--line);
 border-radius:14px;margin:8px 0;padding:11px
}
summary{font-weight:900;cursor:pointer}
details p{font-size:14px;line-height:1.6}
.topic{
 padding:10px;border-bottom:1px solid var(--line)
}
.topic:last-child{border-bottom:none}
.topic-name{font-weight:800}
.topic-summary{font-size:13px;color:#4b5563;margin-top:4px}

/* CALENDAR */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{text-align:center;font-weight:900;font-size:11px;color:#667085}
.day{
 min-height:57px;padding:5px;border:1px solid var(--line);
 border-radius:9px;background:white;font-size:11px
}
.day b{display:block}
.day.done{background:#dcfce7}
.day.partial{background:#fef3c7}
.day.current{outline:2px solid var(--purple)}
.day.future{color:#9ca3af}

/* LISTS */
.listitem{padding:11px 0;border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:none}
.empty{text-align:center;padding:25px;color:var(--muted)}
.mind{
 border-left:4px solid var(--purple);
 padding:7px 0 7px 13px;margin:7px 0
}
.formula{
 font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
 background:#f1f5f9;padding:10px;border-radius:9px;
 font-weight:700;overflow-wrap:anywhere
}
.checkline{display:flex;gap:9px;align-items:center;padding:8px 0}
.checkline input{width:22px;height:22px;accent-color:var(--purple)}

/* NAV */
.bottom{
 position:fixed;bottom:0;left:0;right:0;z-index:200;
 background:white;border-top:1px solid var(--line)
}
.nav-inner{
 max-width:760px;margin:auto;display:grid;
 grid-template-columns:repeat(5,1fr)
}
.nav{
 background:none;padding:9px 2px;min-height:68px;
 color:#667085;font-size:11px;font-weight:800
}
.nav .icon{display:block;font-size:24px;margin-bottom:2px}
.nav.active{color:var(--purple)}

/* MODAL */
.modal{
 position:fixed;inset:0;background:#11182799;
 z-index:300;display:none;align-items:flex-end
}
.modal.open{display:flex}
.sheet{
 background:#f6f7fb;width:min(760px,100%);
 max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;
 padding:15px
}
.tool{
 width:100%;text-align:left;background:white;padding:16px;
 border-radius:16px;margin:5px 0;border:1px solid var(--line);
 font-weight:900;font-size:17px;color:var(--ink)
}

/* TIMER */
.timer{
 font-size:46px;font-weight:900;text-align:center;
 font-variant-numeric:tabular-nums;padding:12px
}
.focus-screen{
 position:fixed;inset:0;background:#101827;color:white;
 z-index:500;padding:25px;display:none
}
.focus-screen.open{display:block}
.focus-task{
 margin-top:15vh;text-align:center;font-size:22px;font-weight:800

@media(max-width:420px){
 .name{font-size:22px}
 .stats{gap:5px}
 .stat b{font-size:14px}
 .grid2{grid-template-columns:1fr}
}
</style>
</head>

function dateObj(s){ return new Date(s+"T12:00:00"); }

function dateStr(d){
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function addDays(date,n){
 const d=dateObj(date);
 d.setDate(d.getDate()+n);
 return dateStr(d);
}

function formatDate(date){

  day:"numeric",month:"short",year:"numeric"
 });

  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
 });
}

function clamp(n,min,max){
 n=Number(n);

function chapterTopics(subject,name){
 const exact = SPECIAL_TOPICS[name];
 const base = exact || GENERIC[subject];
 return base.map((topic,i)=>({
  id:"topic_"+name.replace(/[^a-z0-9]/gi,"_")+"_"+i,
  name:topic,status:"Not Started"
 }));
}

function priorityFor(name){
 const high=[
  "Electrostatics","Current Electricity","Ray Optics","Modern Physics",
  "Solutions","Electrochemistry","Chemical Kinetics","Chemical Bonding",
  "Thermodynamics","Principle of Inheritance and Variation",
  "Molecular Basis of Inheritance","Human Reproduction",
  "Human Health & Diseases","Animal Kingdom","Biomolecules",
  "Cell - The Unit of Life","Photosynthesis in Higher Plants"
 ];
 const medium=[
  "Kinematics","NLM and Friction","Magnetic Effects of Current",
  "Wave Optics","Atomic Structure","Periodic Table","Ionic Equilibrium",
  "Evolution","Body Fluids & Circulation"
 ];
 if(high.includes(name)) return "High";
 if(medium.includes(name)) return "Medium";
 return "Normal";
}

function makeSyllabus(){
 const out=[];
 Object.entries(RAW_SYLLABUS).forEach(([subject,list])=>{
  list.forEach(([classNo,name,total])=>{
   out.push({
    id:"chapter_"+subject+"_"+name.replace(/[^a-z0-9]/gi,"_"),
    subject,classNo,name,total,
    priority:priorityFor(name),
    completed:false,
    topics:chapterTopics(subject,name)
   });
  });
 });
 return out;
}

let DB;

function loadData(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);

  if(!raw){
   DB=defaultData();
   saveData();
   return;
  }

  DB=JSON.parse(raw);

  if(!DB || !Array.isArray(DB.syllabus)) throw new Error("Bad data");

  const fresh=defaultData();

  DB={...fresh,...DB};
  DB.settings={...fresh.settings,...(DB.settings||{})};

  if(!DB.settings.daily) DB.settings.daily=fresh.settings.daily;
  if(!DB.settings.revisionIntervals) DB.settings.revisionIntervals=[3,7,21,45,75];

  DB.syllabus.forEach(c=>{
   if(!Array.isArray(c.topics) || !c.topics.length){
    c.topics=chapterTopics(c.subject,c.name);
   }
  });

 }catch(error){
  DB=defaultData();
  saveData();
 }
}

function saveData(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));
 }catch(e){
  console.error(e);
 }
}

function getChapter(id){

}

function subjectChapters(subject){
 return DB.syllabus.filter(c=>c.subject===subject);
}

function lectureKey(chapter,n){
 return chapter.id+"#"+n;
}

function lectureDone(chapter,n){
 return !!DB.lectureDone[lectureKey(chapter,n)];
}

function totalLectures(){
 return DB.syllabus.reduce((sum,c)=>sum+c.total,0);
}

function completedLectures(){
 return Object.keys(DB.lectureDone).length;
}

function chapterCompletedCount(chapter){
 let n=0;
 for(let i=1;i<=chapter.total;i++){
  if(lectureDone(chapter,i)) n++;
 }
 return n;
}

function chapterPercent(chapter){
 return Math.round(chapterCompletedCount(chapter)/chapter.total*100);
}

function findNextLectures(subject,count){
 const result=[];
 const list=subjectChapters(subject);

 for(const chapter of list){
  if(chapter.completed) continue;

  for(let n=1;n<=chapter.total;n++){
   if(!lectureDone(chapter,n)){
    result.push({chapterId:chapter.id,n});
    if(result.length===count) return result;
   }
  }
 }
 return result;
}

/* =========================================================
   DAILY PLANNING + BACKLOG
========================================================= */

function createDayPlan(date){

 const result={date,Physics:[],Chemistry:[],Botany:[],Zoology:[]};

 for(const subject of ["Physics","Chemistry","Botany","Zoology"]){
  const target=Number(DB.settings.daily[subject])||0;
  result[subject]=findNextLectures(subject,target);
 }

 return result;
}

function getDayPlan(date){
 if(!DB.plannedDays[date]){
  DB.plannedDays[date]=createDayPlan(date);
  saveData();
 }
 return DB.plannedDays[date];
}

function validTask(task){
 const c=getChapter(task.chapterId);
 return c && task.n>=1 && task.n<=c.total;
}

function dayTasks(date){
 const plan=getDayPlan(date);
 const all=[];

 ["Physics","Chemistry","Botany","Zoology"].forEach(subject=>{
  (plan[subject]||[]).forEach(task=>{
   if(validTask(task)) all.push({...task,subject});
  });
 });

 return all;
}

function dayCompletion(date){
 const tasks=dayTasks(date);
 if(!tasks.length) return 100;
 const done=tasks.filter(t=>lectureDone(getChapter(t.chapterId),t.n)).length;
 return Math.round(done/tasks.length*100);
}

function toggleLecture(chapterId,n,checked){

 const chapter=getChapter(chapterId);
 if(!chapter || n<1 || n>chapter.total) return;

 const key=lectureKey(chapter,n);

 if(checked){
  DB.lectureDone[key]={
   id:uid("lecture"),
   date:DB.plannerDate
  };
  scheduleRevisions(chapter,n);
 }else{
  delete DB.lectureDone[key];
 }

 saveData();
 render();

 if(dayCompletion(DB.plannerDate)===100){
  setTimeout(()=>{
   if(confirm("🎉 Today's lecture target is complete!\n\nMove planner date to the next day?")){
    advanceDay();
   }
  },150);
 }
}

function scheduleRevisions(chapter,n){

 DB.settings.revisionIntervals.forEach(interval=>{
  const due=addDays(DB.plannerDate,interval);
  const key=chapter.id+"#"+n+"#"+due;

  if(!DB.revisions.some(r=>r.key===key)){
   DB.revisions.push({
    id:uid("revision"),
    key,
    chapterId:chapter.id,
    lecture:n,
    due,
    type:"Quick Recall",
    done:false
   });
  }
 });
}

function advanceDay(){

 const oldDate=DB.plannerDate;
 const plan=getDayPlan(oldDate);
 const unfinished={Physics:[],Chemistry:[],Botany:[],Zoology:[]};

 for(const subject of Object.keys(unfinished)){
  (plan[subject]||[]).forEach(t=>{
   const c=getChapter(t.chapterId);
   if(c && !lectureDone(c,t.n)){
    unfinished[subject].push(t);
   }
  });
 }

 let next=addDays(oldDate,1);

 if(next>END_DATE){
  alert("Planner period has reached 30 December 2026.");
  return;
 }

 if(!DB.plannedDays[next]){
  DB.plannedDays[next]=createDayPlan(next);
 }

 /* backlog: distribute realistically, max +1 per subject next day */
 for(const subject of Object.keys(unfinished)){
  if(unfinished[subject].length){

   const nextPlan=DB.plannedDays[next][subject]||[];

   for(const task of unfinished[subject]){
    const already=nextPlan.some(x=>x.chapterId===task.chapterId && x.n===task.n);

    if(!already){
     nextPlan.push(task);
     break;
    }
   }

   DB.plannedDays[next][subject]=nextPlan;
  }
 }

 DB.plannerDate=next;
 saveData();
 render();
}

function setPlannerDate(date){
 if(date<START_DATE || date>END_DATE){
  alert("Choose a date between 31 August and 30 December 2026.");
  return;
 }
 DB.plannerDate=date;
 getDayPlan(date);
 saveData();
 render();
}

let timerInterval=null;

function timerSeconds(){

 if(!DB.timer) return 0;

 let elapsed=DB.timer.elapsed||0;

 if(DB.timer.running && DB.timer.startedAt){
  elapsed += Date.now()-DB.timer.startedAt;
 }

 return Math.max(0,Math.floor(elapsed/1000));
}

function formatSeconds(sec){
 const h=Math.floor(sec/3600);
 const m=Math.floor(sec%3600/60);
 const s=sec%60;
 return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}

function timerAction(){

 if(!DB.timer){
  DB.timer={
   running:true,
   startedAt:Date.now(),
   elapsed:0,
   category:"Study",
   subject:"",
   chapter:""
  };
 }else if(DB.timer.running){
  DB.timer.elapsed=(DB.timer.elapsed||0)+(Date.now()-DB.timer.startedAt);
  DB.timer.running=false;
  DB.timer.startedAt=null;
 }else{
  DB.timer.running=true;
  DB.timer.startedAt=Date.now();
 }

 saveData();
 renderTimerOnly();
}

function stopTimer(){

 if(!DB.timer) return;

 let duration=timerSeconds()*1000;

 if(duration>0){
  DB.studySessions.push({
   id:uid("session"),
   start:DB.timer.startedAt||Date.now()-duration,
   end:Date.now(),
   duration,
   category:DB.timer.category||"Study"
  });
 }

 DB.timer=null;
 saveData();
 render();
}

function resetTimer(){
 DB.timer=null;
 saveData();
 renderTimerOnly();
}

function renderTimerOnly(){
 const e=document.getElementById("timerDisplay");
 const f=document.getElementById("focusTimer");
 const text=formatSeconds(timerSeconds());

 if(e)e.textContent=text;
 if(f)f.textContent=text;

 if(timerInterval) clearInterval(timerInterval);

 if(DB.timer && DB.timer.running){
  timerInterval=setInterval(()=>{
   const a=document.getElementById("timerDisplay");
   const b=document.getElementById("focusTimer");
   const x=formatSeconds(timerSeconds());
   if(a)a.textContent=x;
   if(b)b.textContent=x;
  },1000);
 }
}

function calculateStreak(){
 let d=DB.plannerDate,count=0;

 for(let i=0;i<200;i++){
  const tasks=dayTasks(d);
  if(tasks.length && tasks.some(t=>lectureDone(getChapter(t.chapterId),t.n))){
   count++;
   d=addDays(d,-1);
  }else break;
 }

 return count;
}

function renderCalendar(){

 const current=dateObj(DB.plannerDate);
 const year=current.getFullYear();
 const month=current.getMonth();

 const first=new Date(year,month,1);
 const last=new Date(year,month+1,0);

 let cells=[];

 for(let i=0;i<first.getDay();i++)cells.push(`<div></div>`);

 for(let day=1;day<=last.getDate();day++){

  const date=dateStr(new Date(year,month,day));
  let cls="day";

  const pct=dayCompletion(date);

  if(date===DB.plannerDate)cls+=" current";
  if(date>DB.plannerDate)cls+=" future";
  if(pct===100 && dayTasks(date).length)cls+=" done";
  else if(pct>0)cls+=" partial";

  cells.push(`
   <button class="${cls}" onclick="setPlannerDate('${date}')">
    <b>${day}</b>
    <span>${pct}%</span>
   </button>
  `);
 }

 return `
 <section class="screen active">
  <div class="card">
   <div class="title">📆 Calendar</div>
   <div class="subtitle">${current.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</div>
   <div class="calendar" style="margin-top:10px">
    ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cal-head">${x}</div>`).join("")}
    ${cells.join("")}
   </div>
  </div>
 </section>`;
}

function mastery(c){

 const lecture=chapterPercent(c);
 const topics=Math.round(c.topics.filter(t=>t.status==="Strong").length/c.topics.length*100);
 const ncert=ncertPercent(c);

 const checks=chapterCheckData(c.id);
 const checklist=Math.round(
  Object.values(checks).filter(Boolean).length/CHECKS.length*100
 );

 return Math.round((lecture+topics+ncert+checklist)/4);
}

function setTopicStatus(chapterId,index,value){
 const c=getChapter(chapterId);
 if(c && c.topics[index]){

 }
}

function renderWeekly(){

 const current=dateObj(DB.plannerDate);
 const day=current.getDay();
 const monday=new Date(current);
 monday.setDate(current.getDate()-(day===0?6:day-1));

 const start=dateStr(monday);
 const end=addDays(start,6);

 let lectureTotal=0,lectureDone=0;

 for(let i=0;i<7;i++){
  const date=addDays(start,i);
  const tasks=dayTasks(date);
  lectureTotal+=tasks.length;
  lectureDone+=tasks.filter(t=>lectureDone(getChapter(t.chapterId),t.n)).length;
 }

 const target={
  lectures:lectureTotal,
  questions:150,
  hours:DB.settings.studyTarget*7,
  revisions:DB.revisions.filter(r=>r.due>=start&&r.due<=end).length,
  tests:1
 };

 const completed={
  lectures:lectureDone,
  questions:DB.questions.filter(q=>q.date>=start&&q.date<=end).length,
  hours:Object.entries(DB.manualHours).filter(([d])=>d>=start&&d<=end)
   .reduce((s,[,v])=>s+(Number(v)||0),0),
  revisions:DB.revisions.filter(r=>r.done&&r.due>=start&&r.due<=end).length,
  tests:DB.tests.filter(t=>t.date>=start&&t.date<=end).length
 };

 return `

 <div class="card hero">
  <div class="title">📅 WEEKLY TARGETS</div>
  ${formatDate(start)} → ${formatDate(end)}

  return `
   <div class="card">

}

function populateUnits(){

function convertUnit(){

 const cat=document.getElementById("unitCategory").value;

 const from=document.getElementById("unitFrom").value;

 if(!Number.isFinite(value))return;

 const result=value*UNITS[cat][from]/UNITS[cat][to];

  result.toExponential(6).replace(/\.?0+e/,"e")+" "+to;
}

function calculateSlope(){

 const x1=Number(document.getElementById("x1").value);
 const y1=Number(document.getElementById("y1").value);
 const x2=Number(document.getElementById("x2").value);
 const y2=Number(document.getElementById("y2").value);

 if(x2===x1 || ![x1,y1,x2,y2].every(Number.isFinite)){
  document.getElementById("slopeResult").innerHTML="<p>Enter valid points with x₂ ≠ x₁.</p>";
  return;
 }

 const slope=(y2-y1)/(x2-x1);

 document.getElementById("slopeResult").innerHTML=
  `<div class="card"><b>Slope = ${slope}</b><div class="formula">(${y2} − ${y1}) / (${x2} − ${x1}) = ${slope}</div></div>`;
}

   return `<div class="listitem">

function saveTest(){

 const correct=Math.max(0,Number(document.getElementById("testCorrect").value)||0);
 const wrong=Math.max(0,Number(document.getElementById("testWrong").value)||0);
 const skipped=Math.max(0,Number(document.getElementById("testSkipped").value)||0);
 const time=Math.max(0,Number(document.getElementById("testTime").value)||0);

 DB.tests.push({
  id:uid("test"),
  type:document.getElementById("testType").value,
  correct,wrong,skipped,time,date:DB.plannerDate
 });

 saveData();
 render();
}

/* =========================================================

function renderBackup(){

 return `
 <section class="screen active">

 <div class="card hero">
  <div class="title">💾 BACKUP / RESTORE</div>
  <div>All progress is stored locally in this browser.</div>
 </div>

 <div class="card">
  <button class="btn primary" onclick="exportBackup()">EXPORT BACKUP</button>
 </div>

 <div class="card">
  <label class="form">IMPORT BACKUP JSON
   <input type="file" accept=".json,application/json" onchange="importBackup(this)">
  </label>
 </div>

 <div class="card">
  <button class="btn danger" onclick="resetAll()">RESET ALL DATA</button>
 </div>

 </section>`;
}

function exportBackup(){

 const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="saad-khan-neet-2027-backup.json";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importBackup(input){

 const file=input.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(){
  try{
   const data=JSON.parse(reader.result);

   if(!data || !Array.isArray(data.syllabus)){
    throw new Error("Invalid backup");
   }

   if(!confirm("Restore this backup? Current data will be replaced."))return;

   DB=data;
   saveData();
   render();

   alert("Backup restored successfully.");

  }catch(e){
   alert("Invalid or corrupted backup file.");
  }
 };

 reader.readAsText(file);
}

function resetAll(){

 if(!confirm("This will permanently delete all planner progress from this browser. Continue?"))return;
 if(!confirm("Final confirmation: reset all data?"))return;

 DB=defaultData();
 saveData();
 render();
}

function renderSettings(){

 return `
 <section class="screen active">

 <div class="card hero">
  <div class="title">⚙️ SETTINGS</div>
 </div>

 <div class="card">
  <div class="title">Daily Lecture Targets</div>

  ${["Physics","Chemistry","Botany","Zoology"].map(s=>`
   <label class="form">${s}
    <input type="number" min="0" max="10"
     value="${DB.settings.daily[s]}"
     onchange="updateDailyTarget('${s}',this.value)">
   </label>`).join("")}
 </div>

 <div class="card">
  <label class="form">Daily Study Hours Target
   <input type="number" min="0" max="24"
    value="${DB.settings.studyTarget}"
    onchange="DB.settings.studyTarget=Math.max(0,Number(this.value)||0);saveData()">
  </label>
 </div>

 <div class="card">
  <label class="form">Revision intervals (days, comma separated)
   <input value="${DB.settings.revisionIntervals.join(",")}"
    onchange="updateRevisionIntervals(this.value)">
  </label>
 </div>

 <div class="card">
  <div class="title">Planner Date</div>
  <input type="date" min="${START_DATE}" max="${END_DATE}"
   value="${DB.plannerDate}" onchange="setPlannerDate(this.value)">
  <p class="muted">Fixed syllabus is protected. Changing settings does not delete existing progress.</p>
 </div>

 </section>`;
}

function updateDailyTarget(subject,value){
 DB.settings.daily[subject]=clamp(value,0,10);
 saveData();
}

function updateRevisionIntervals(value){
 const arr=value.split(",")
  .map(x=>Math.max(1,parseInt(x.trim())))
  .filter(Number.isFinite);

 if(arr.length)DB.settings.revisionIntervals=[...new Set(arr)].sort((a,b)=>a-b);
 saveData();
}

  today:renderToday,
  days:renderDays,
  calendar:renderCalendar,
  syllabus:renderSyllabus,
  progress:renderProgress,

  questions:renderQuestions,
  ncert:renderNCERT,
  notes:renderNotes,
  formulas:renderFormulaBank,
  errors:renderErrorBook,
  weak:renderWeakTopics,
  strong:renderStrongTopics,
  maths:renderBasicMaths,
  units:renderUnitConverter,
  graph:renderGraphTool,
  tests:renderTests,
  timer:renderTimer,
  mnemonics:renderMnemonics,
  resources:renderResources,
  bookmarks:renderBookmarks,
  completed:renderCompleted,
  janmay:renderJanMay,
  backup:renderBackup,
  settings:renderSettings,
  focus:()=>{openFocus();return renderToday();}
 };

 main.innerHTML=(map[name]||renderToday)();

 document.querySelectorAll(".nav").forEach(x=>{
  x.classList.toggle("active",x.dataset.screen===name);
 });

 updateHeader();
 renderTimerOnly();

 if(name==="units")setTimeout(populateUnits,0);

 window.scrollTo({top:0,behavior:"smooth"});
}

function render(){
 renderScreen("today");
}
